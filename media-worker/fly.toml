# Fly.io config for the Xeno media worker. Deploy from this directory:
#   fly deploy
# The only required secret is set separately, never here:
#   fly secrets set MEDIA_WORKER_SHARED_SECRET=...

app = "xeno-media-worker"
primary_region = "syd"
# The worker drains for up to 20s on SIGTERM; give it a little longer.
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Two lanes: renders and other video encodes, and quick tasks (probes,
  # thumbnails, frames, audio) that never wait behind a render.
  HEAVY_CONCURRENCY = "2"
  QUICK_CONCURRENCY = "2"
  # A render's clips that aren't joined to the one before are made two at a time.
  CLIP_PARALLELISM = "2"
  MAX_QUEUE_DEPTH = "50"
  TASK_TIMEOUT_SECONDS = "900"
  # Editor renders: each FFmpeg step may take up to 12 hours (the longest edit,
  # ten minutes at 60 fps, two renders at once); a step that writes nothing new
  # for 20 minutes has hung and is stopped.
  RENDER_TIMEOUT_SECONDS = "43200"
  RENDER_STALL_SECONDS = "1200"
  # Not always on: after 10 minutes with nothing running, queued or still
  # being reported, the worker exits and its machine stops (billed only for its
  # disk). Fly starts it again for the next request, in a few seconds.
  IDLE_STOP_SECONDS = "600"

[http_service]
  internal_port = 8080
  force_https = true
  # Tasks are acknowledged with 202 and rendered afterwards, so Fly's proxy
  # would see a machine mid-render as idle: its auto-stop stays off, and the
  # worker stops itself once idle (IDLE_STOP_SECONDS). The proxy starts the
  # machine again for the next request. The queue and task_id idempotency are
  # in memory: run exactly one machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 50

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

# A clean exit (the worker stopping itself when idle) leaves the machine
# stopped; a crash restarts it.
[[restart]]
  policy = "on-failure"
  retries = 10

# FFmpeg is CPU bound. Performance vCPUs are dedicated: never throttled, where
# shared ones drop to a sixteenth of a core each once their burst balance (at
# most about nine minutes of full speed) is spent. Billed per second while the
# machine runs; it stops when idle.
[[vm]]
  cpu_kind = "performance"
  cpus = 4
  memory = "8gb"
