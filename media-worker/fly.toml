# Fly.io config for the Xeno media worker. Deploy from this directory:
#   fly deploy
# The only required secret is set separately, never here:
#   fly secrets set MEDIA_WORKER_SHARED_SECRET=...

app = "xeno-media-worker"
primary_region = "syd"
# The worker drains for up to 20s on SIGTERM; give it a little longer.
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CONCURRENCY = "2"
  MAX_QUEUE_DEPTH = "50"
  TASK_TIMEOUT_SECONDS = "900"

[http_service]
  internal_port = 8080
  force_https = true
  # Tasks are acknowledged with 202 and rendered afterwards, so Fly would see
  # an idle machine mid-render. Keep it running instead of auto-stopping.
  # The queue and task_id idempotency are in memory: run exactly one machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 50

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

# FFmpeg is CPU bound: two vCPUs comfortably serve CONCURRENCY=2.
[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"
